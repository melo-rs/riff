services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      - POSTGRES_USER=${RIFF_POSTGRES_USER}
      - POSTGRES_PASSWORD=${RIFF_POSTGRES_PWD}
      - POSTGRES_DB=${RIFF_POSTGRES_DATABASE}
      - POSTGRES_PORT=${RIFF_POSTGRES_PORT:-5432}
    volumes:
      - database:/var/lib/postgresql
    ports:
      - ${RIFF_POSTGRES_PORT:-5432}:5432
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-q",
          "-d",
          "${RIFF_POSTGRES_DATABASE}",
          "-U",
          "${RIFF_POSTGRES_USER}",
        ]
      timeout: 40s
      interval: 2s
      retries: 20

volumes:
  database: